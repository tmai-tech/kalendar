name: Build Sample APK

on:
  push:
    branches:
      - ci/build-sample-apk
  pull_request:
    branches:
      - ci/build-sample-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :sample:assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find sample/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under sample/build/outputs/apk"
            find sample/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
