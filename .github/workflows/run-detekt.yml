name: Check Code - Detekt

on:
  push:
    branches:
      - main
      - feat/season-theme
  pull_request:
    branches:
      - main
      - feat/season-theme
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kalendar Repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Run Detekt
        run: ./gradlew detekt